# SPDX-License-Identifier: GPL-3.0-or-later
# Single source for docs/INSTALL.md (scripts/gen-install.py) and for the
# documentation test (scripts/test-docs.sh), which runs every command below in
# a container of each listed image, as a normal user with sudo, against the
# checkout under test (copied instead of cloned; `git pull` is left out) and a
# local copy of the release files.
#
# Per step, `test` says how the commands are exercised:
#   "run"      run as written (default)
#   "resolve"  package installs are resolved but not downloaded
#              (apt-get -s, dnf --assumeno, zypper --dry-run, pacman --print):
#              used for GPU drivers, which cannot work in a container
#   "skip: …"  not runnable in CI; the reason is shown in the test report
# `{releases}` is the latest-release download URL; the test points it at a
# local copy.

releases = "https://github.com/oreo1298/FreeMediaConverter/releases/latest/download"

intro = """
Retort is installed the same way on every distribution: install the build
tools once, clone this repository and run one command. It builds a normal
`.deb`, `.rpm` or pacman package on your machine and installs it, so your
package manager pulls in FFmpeg and the other dependencies and can remove
Retort again. To update, pull the new code and run the same command again.

Retort needs GTK 4.14+, libadwaita 1.5+ and FFmpeg 6.1 or newer. On older
systems, or if you would rather not build anything, use the Flatpak, AppImage
or portable tarball from the [Releases page](https://github.com/oreo1298/FreeMediaConverter/releases)
([other ways to install](#flatpak)).

Every command on this page is run by `scripts/test-docs.sh` in a fresh
container of that system, as a normal user, before each release.

After installing, open **System Check** from the main menu (or run
`retort-cli diagnose`): it tells you exactly which hardware acceleration works
and which package to install for the rest.
"""

[[section]]
id = "debian"
title = "Ubuntu 24.04 LTS and newer, Debian 13"
images = ["ubuntu:24.04", "ubuntu:26.04", "debian:trixie"]
text = """
Run these as your normal user (not root). First the build tools and Rust
(1.92 or newer), once. On Ubuntu:
"""
[[section.step]]
images = ["ubuntu:24.04", "ubuntu:26.04"]
commands = [
  "sudo apt install git build-essential debhelper meson ninja-build pkg-config gettext appstream desktop-file-utils libgtk-4-dev libadwaita-1-dev cargo-1.97",
]
[[section.step]]
text = "On Debian 13 (its own Rust is too old; `rustup` installs the current one):"
images = ["debian:trixie"]
commands = [
  "sudo apt install git build-essential debhelper meson ninja-build pkg-config gettext appstream desktop-file-utils libgtk-4-dev libadwaita-1-dev rustup",
  "rustup default stable",
]
[[section.step]]
title = "Build and install"
text = """
`build-package.sh` builds the `retort` and `retort-cli` packages into
`_package/` and installs them with apt, which also installs FFmpeg. It asks
for your password when it installs. The first build downloads the Rust crates
and takes several minutes.
"""
commands = [
  "git clone https://github.com/oreo1298/FreeMediaConverter.git",
  "cd FreeMediaConverter",
  "./build-package.sh",
]
test_check = ["retort-cli presets > /dev/null", "test -x /usr/bin/retort"]
[[section.step]]
title = "Update"
text = "Pull the new code and build again from the same folder:"
commands = [
  "cd FreeMediaConverter",
  "git pull",
  "./build-package.sh",
]
test_check = ["retort-cli presets > /dev/null"]

[[section.step]]
title = "Hardware acceleration — Intel (Broadwell and newer)"
text = "Debian only: enable the `non-free` component first (Ubuntu has it in `multiverse`, enabled by default)."
images = ["debian:trixie"]
commands = [
  "sudo sed -i 's/^Components: main$/Components: main contrib non-free non-free-firmware/' /etc/apt/sources.list.d/debian.sources",
  "sudo apt update",
]
[[section.step]]
text = "Then, on both:"
commands = ["sudo apt install intel-media-va-driver-non-free libmfx-gen1.2 libvpl2"]
[[section.step]]
title = "Hardware acceleration — AMD"
commands = ["sudo apt install mesa-va-drivers"]
[[section.step]]
title = "Hardware acceleration — NVIDIA"
text = "Install the proprietary driver; NVENC and NVDEC come with it. On Ubuntu use *Software & Updates → Additional Drivers*, or:"
images = ["ubuntu:24.04", "ubuntu:26.04"]
commands = ["sudo ubuntu-drivers install"]
test = "skip: needs NVIDIA hardware (the package names below are resolved instead)"
[[section.step]]
text = "On Debian 13 (with `non-free` enabled as above):"
images = ["debian:trixie"]
commands = ["sudo apt install nvidia-driver libnvidia-encode1 libcuda1"]
test = "resolve"
[[section.step]]
title = "Remove"
commands = ["sudo apt remove retort retort-cli"]
test_check = ["test ! -e /usr/bin/retort-cli", "test ! -e /usr/bin/retort"]
[[section.step]]
title = "Servers: command line only"
text = """
`retort-cli` does not need GTK. To install only it, build without installing
and install that one package (the build tools are only needed for building):
"""
commands = [
  "./build-package.sh --no-install",
  "sudo apt install ./_package/retort-cli_*.deb",
]
test_check = ["retort-cli presets > /dev/null", "test ! -e /usr/bin/retort"]

[[section]]
id = "fedora"
title = "Fedora 45"
images = ["fedora:45"]
text = "Run these as your normal user (not root). First the build tools, once:"
[[section.step]]
commands = [
  "sudo dnf install -y git rpm-build gcc meson ninja-build gettext desktop-file-utils appstream gtk4-devel libadwaita-devel cargo",
]
[[section.step]]
title = "Build and install"
text = """
`build-package.sh` builds the `retort` and `retort-cli` RPMs into `_package/`
and installs them with dnf. It asks for your password when it installs. The
first build downloads the Rust crates and takes several minutes. Fedora's own
`ffmpeg-free` is installed with it; it lacks the H.264/HEVC encoders, so
switch to RPM Fusion's full FFmpeg afterwards (next step).
"""
commands = [
  "git clone https://github.com/oreo1298/FreeMediaConverter.git",
  "cd FreeMediaConverter",
  "./build-package.sh",
]
test_check = ["retort-cli presets > /dev/null", "test -x /usr/bin/retort"]
[[section.step]]
title = "Full FFmpeg from RPM Fusion"
commands = [
  "sudo dnf install -y https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm",
  "sudo dnf swap -y ffmpeg-free ffmpeg --allowerasing",
]
[[section.step]]
title = "Update"
text = "Pull the new code and build again from the same folder:"
commands = [
  "cd FreeMediaConverter",
  "git pull",
  "./build-package.sh",
]
test_check = ["retort-cli presets > /dev/null"]
[[section.step]]
title = "Hardware acceleration — Intel"
commands = ["sudo dnf install -y intel-media-driver intel-vpl-gpu-rt"]
[[section.step]]
title = "Hardware acceleration — AMD (H.264/HEVC encode)"
commands = ["sudo dnf install -y mesa-va-drivers-freeworld"]
[[section.step]]
title = "Hardware acceleration — NVIDIA"
commands = ["sudo dnf install -y akmod-nvidia xorg-x11-drv-nvidia-cuda"]
test = "resolve"
[[section.step]]
title = "Remove"
commands = ["sudo dnf remove -y retort retort-cli"]
test_check = ["test ! -e /usr/bin/retort-cli", "test ! -e /usr/bin/retort"]

[[section]]
id = "el"
title = "AlmaLinux, Rocky Linux and RHEL 10"
images = ["almalinux:10"]
text = """
Run these as your normal user (not root). The build tools come from the CRB
repository and FFmpeg from EPEL (`ffmpeg-free`); RPM Fusion has the full
build. Once:
"""
[[section.step]]
commands = [
  "sudo dnf install -y epel-release",
  "sudo dnf config-manager --set-enabled crb",
  "sudo dnf install -y git rpm-build gcc meson ninja-build gettext desktop-file-utils appstream gtk4-devel libadwaita-devel cargo",
]
[[section.step]]
title = "Build and install"
text = "This builds the `retort` and `retort-cli` RPMs and installs them with dnf (it asks for your password):"
commands = [
  "git clone https://github.com/oreo1298/FreeMediaConverter.git",
  "cd FreeMediaConverter",
  "./build-package.sh",
]
test_check = ["retort-cli presets > /dev/null", "test -x /usr/bin/retort"]
[[section.step]]
title = "Full FFmpeg from RPM Fusion"
commands = [
  "sudo dnf install -y https://mirrors.rpmfusion.org/free/el/rpmfusion-free-release-10.noarch.rpm https://mirrors.rpmfusion.org/nonfree/el/rpmfusion-nonfree-release-10.noarch.rpm",
  "sudo dnf swap -y ffmpeg-free ffmpeg --allowerasing",
]
[[section.step]]
title = "Update"
text = "Pull the new code and build again from the same folder:"
commands = [
  "cd FreeMediaConverter",
  "git pull",
  "./build-package.sh",
]
test_check = ["retort-cli presets > /dev/null"]
[[section.step]]
title = "Hardware acceleration — Intel"
commands = ["sudo dnf install -y intel-media-driver"]
[[section.step]]
title = "Hardware acceleration — NVIDIA"
text = "From NVIDIA's own repository (RPM Fusion has no NVIDIA driver for EL 10):"
commands = [
  "sudo dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel10/$(uname -m)/cuda-rhel10.repo",
  "sudo dnf install -y nvidia-driver-cuda-libs nvidia-driver-libs",
]
test = "resolve"
[[section.step]]
title = "Remove"
commands = ["sudo dnf remove -y retort retort-cli"]
test_check = ["test ! -e /usr/bin/retort-cli", "test ! -e /usr/bin/retort"]

[[section]]
id = "opensuse"
title = "openSUSE Tumbleweed and Leap 16"
images = ["opensuse/tumbleweed", "opensuse/leap:16.0"]
text = "Run these as your normal user (not root). First the build tools, once:"
[[section.step]]
commands = [
  "sudo zypper install -y git rpm-build gcc meson ninja gettext-tools desktop-file-utils AppStream gtk4-devel libadwaita-devel cargo",
]
[[section.step]]
title = "Build and install"
text = """
This builds the `retort` and `retort-cli` RPMs and installs them with zypper
(it asks for your password; the packages are built locally, so zypper asks
nothing about signatures). openSUSE's own FFmpeg lacks the H.264/HEVC
encoders: switch to Packman's full build afterwards (next step).
"""
commands = [
  "git clone https://github.com/oreo1298/FreeMediaConverter.git",
  "cd FreeMediaConverter",
  "./build-package.sh",
]
test_check = ["retort-cli presets > /dev/null", "test -x /usr/bin/retort"]
[[section.step]]
title = "Full FFmpeg from Packman (Tumbleweed)"
images = ["opensuse/tumbleweed"]
commands = [
  "sudo zypper addrepo --refresh --priority 90 https://ftp.gwdg.de/pub/linux/misc/packman/suse/openSUSE_Tumbleweed/ packman",
  "sudo zypper --gpg-auto-import-keys refresh packman",
  "sudo zypper install -y --from packman --allow-vendor-change ffmpeg",
]
[[section.step]]
title = "Full FFmpeg from Packman (Leap 16)"
images = ["opensuse/leap:16.0"]
commands = [
  "sudo zypper addrepo --refresh --priority 90 https://ftp.gwdg.de/pub/linux/misc/packman/suse/openSUSE_Leap_16.0/ packman",
  "sudo zypper --gpg-auto-import-keys refresh packman",
  "sudo zypper install -y --from packman --allow-vendor-change ffmpeg-8 -ffmpeg-7",
]
[[section.step]]
title = "Update"
text = "Pull the new code and build again from the same folder:"
commands = [
  "cd FreeMediaConverter",
  "git pull",
  "./build-package.sh",
]
test_check = ["retort-cli presets > /dev/null"]
[[section.step]]
title = "Hardware acceleration — Intel"
commands = ["sudo zypper install -y intel-media-driver libvpl2"]
[[section.step]]
title = "Remove"
commands = ["sudo zypper remove -y retort retort-cli"]
test_check = ["test ! -e /usr/bin/retort-cli", "test ! -e /usr/bin/retort"]

[[section]]
id = "arch"
title = "Arch Linux"
images = ["archlinux"]
text = """
Run these as your normal user (not root); `makepkg` asks for your password
when it installs the dependencies and the package:
"""
[[section.step]]
commands = [
  "sudo pacman -S --needed base-devel git",
  "git clone https://github.com/oreo1298/FreeMediaConverter.git",
  "cd FreeMediaConverter",
  "makepkg -si",
]
test_check = ["retort-cli presets > /dev/null", "test -x /usr/bin/retort"]
[[section.step]]
text = """
This builds and installs the `retort` and `retort-cli` packages. Dependencies
(pulled in automatically): `gtk4`, `libadwaita` and `ffmpeg`, plus `cargo`,
`meson` and a few other tools for building.

To update later, pull the new code and build again from the same folder
(`-f` rebuilds even when the version number has not changed):
"""
commands = [
  "cd FreeMediaConverter",
  "git pull",
  "makepkg -sif",
]
test_check = ["retort-cli presets > /dev/null"]
tip = "If `makepkg` says `PKGBUILD does not exist`, you are not inside the `FreeMediaConverter` folder."
[[section.step]]
title = "Hardware acceleration — Intel"
commands = ["sudo pacman -S --needed intel-media-driver vpl-gpu-rt"]
[[section.step]]
title = "Hardware acceleration — NVIDIA"
commands = ["sudo pacman -S --needed nvidia-utils"]
test = "resolve"
[[section.step]]
title = "Remove"
commands = ["sudo pacman -R retort retort-cli"]
test_check = ["test ! -e /usr/bin/retort-cli", "test ! -e /usr/bin/retort"]

[[section]]
id = "flatpak"
title = "Flatpak (any distribution, nothing to build)"
images = ["flatpak"]
text = """
The Flatpak bundles a complete FFmpeg 9 (x264, x265, SVT-AV1, libvpx, libaom,
Opus, LAME, libplacebo, NVENC/NVDEC, VA-API, Vulkan and Quick Sync support)
on the GNOME 51 runtime. It works on every distribution with Flatpak,
including Debian 12 and Ubuntu 22.04 whose GTK is too old for Retort, and
needs no build. Until Retort is on Flathub, install the bundle from the
release:
"""
[[section.step]]
commands = [
  "flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo",
  "curl -fLO {releases}/Retort-$(uname -m).flatpak",
  "flatpak install --user -y Retort-$(uname -m).flatpak",
  "flatpak run io.github.oreo1298.Retort",
]
test_commands = [
  "flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo",
  "curl -fLO {releases}/Retort-$(uname -m).flatpak",
  "flatpak install --user -y Retort-$(uname -m).flatpak",
  "flatpak run --command=retort-cli io.github.oreo1298.Retort presets",
]
test_note = "The test runs the bundled retort-cli instead of the GUI (no display)."

[[section]]
id = "appimage"
title = "AppImage (glibc 2.39 or newer)"
images = ["ubuntu:24.04"]
text = """
One file with GTK, libadwaita and a full FFmpeg inside; your system's GPU
drivers are used. Download, make executable, run:
"""
[[section.step]]
commands = [
  "curl -fLO {releases}/Retort-$(uname -m).AppImage",
  "chmod +x Retort-$(uname -m).AppImage",
  "./Retort-$(uname -m).AppImage",
]
test_commands = [
  "sudo apt install xvfb xauth libgtk-4-1",
  "curl -fLO {releases}/Retort-$(uname -m).AppImage",
  "chmod +x Retort-$(uname -m).AppImage",
  "APPIMAGE_EXTRACT_AND_RUN=1 timeout 20 xvfb-run -a ./Retort-$(uname -m).AppImage || test $? -eq 124",
]
tip = "Without FUSE (some containers and minimal systems), run it as `APPIMAGE_EXTRACT_AND_RUN=1 ./Retort-$(uname -m).AppImage`."
test_note = "The test container gets Xvfb and the desktop libraries every GTK desktop has (the AppImage uses the host's libGL, fontconfig and friends), then starts the app for 20 seconds."

[[section]]
id = "tarball"
title = "Portable tarball (any distribution with GTK 4.14+ and libadwaita 1.5+)"
images = ["fedora:45"]
text = """
Install GTK 4, libadwaita and FFmpeg from your distribution first. The
tarball installs into `~/.local` (or `/usr/local` with `--system`) and can
uninstall itself. This build can optionally check for updates (off by default).
"""
[[section.step]]
commands = [
  "curl -fLO {releases}/retort-linux-$(uname -m).tar.xz",
  "tar xf retort-linux-$(uname -m).tar.xz",
  "./retort-*-linux/install.sh",
]
[[section.step]]
text = "To remove it later:"
commands = ["~/.local/share/retort/uninstall.sh"]

[[section]]
id = "nix"
title = "Nix and NixOS"
images = []
text = "Run it directly, or add the flake to your configuration:"
[[section.step]]
commands = ["nix run github:oreo1298/FreeMediaConverter"]
test = "skip: equivalent tested by the Packaging workflow's Nix job (nix build of the same flake)"

[[section]]
id = "gentoo-void"
title = "Gentoo and Void Linux"
images = []
text = """
An ebuild (`packaging/gentoo/media-video/retort`) and a Void template
(`packaging/void/srcpkgs/retort`) are in the repository and are submitted to
GURU and void-packages with each release.
"""

[[section]]
id = "source"
title = "Without a package (Meson)"
images = ["ubuntu:24.04"]
text = """
For development, or a distribution without `.deb`, `.rpm` or pacman: build
with Meson and install into `/usr/local` (no package manager involved). Needs
Rust 1.92+, Meson 0.62+, GTK 4.14+, libadwaita 1.5+, gettext,
desktop-file-utils, AppStream and FFmpeg. On Ubuntu 24.04:
"""
[[section.step]]
commands = [
  "sudo apt install build-essential curl git meson ninja-build pkg-config gettext appstream desktop-file-utils libgtk-4-dev libadwaita-1-dev ffmpeg",
  "curl -sSf https://sh.rustup.rs | sh -s -- -y",
  ". \"$HOME/.cargo/env\"",
  "git clone https://github.com/oreo1298/FreeMediaConverter.git",
  "cd FreeMediaConverter",
  "meson setup _build --prefix=/usr/local",
  "meson compile -C _build",
  "sudo meson install -C _build --no-rebuild",
]
test_check = ["retort-cli presets > /dev/null"]

[[section]]
id = "check"
title = "After installing"
images = []
text = """
Start Retort from your applications menu. Then open **System Check** (main
menu) or run `retort-cli diagnose`: it lists every GPU, which encoders and
decoders passed a real test, and the exact commands to fix anything missing.
"""
