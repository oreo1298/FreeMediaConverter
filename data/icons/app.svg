<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: CC-BY-SA-4.0 -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="liquid" x1="18" y1="72" x2="80" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c061cb"/>
      <stop offset="0.5" stop-color="#7d5bd6"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
    <linearGradient id="liquidTop" x1="0" y1="68" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0a3e6"/>
      <stop offset="1" stop-color="#a079e6"/>
    </linearGradient>
    <linearGradient id="glass" x1="20" y1="44" x2="78" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ebe7f5"/>
    </linearGradient>
    <linearGradient id="neckGlass" x1="56" y1="20" x2="112" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4def2"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="56" x2="0" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#57e389"/>
      <stop offset="1" stop-color="#26a269"/>
    </linearGradient>
    <clipPath id="bulbClip">
      <circle cx="48" cy="80" r="30"/>
    </clipPath>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="50" cy="118" rx="34" ry="4.5" fill="#241f31" opacity="0.16"/>

  <!-- depth (GNOME-style base side): the whole glass, 4 px lower and darker -->
  <g transform="translate(0 4)">
    <path d="M52 52 C 56 32, 74 22, 92 27 L 110 37" fill="none" stroke="#9d8fc6" stroke-width="14" stroke-linecap="round"/>
    <circle cx="48" cy="80" r="34" fill="#9d8fc6"/>
  </g>

  <!-- neck (drawn under the bulb so the join is seamless) -->
  <path d="M52 52 C 56 32, 74 22, 92 27 L 110 37" fill="none" stroke="#cfc6e6" stroke-width="14" stroke-linecap="round"/>
  <path d="M52 52 C 56 32, 74 22, 92 27 L 110 37" fill="none" stroke="url(#neckGlass)" stroke-width="11" stroke-linecap="round"/>

  <!-- bulb -->
  <circle cx="48" cy="80" r="34" fill="#cfc6e6"/>
  <circle cx="48" cy="80" r="32.5" fill="url(#glass)"/>

  <!-- liquid -->
  <g clip-path="url(#bulbClip)">
    <rect x="14" y="74" width="70" height="40" fill="url(#liquid)"/>
    <path d="M14 76 C 26 69, 36 81, 49 75 C 62 69, 72 80, 84 74 L 84 81 L 14 81 Z" fill="url(#liquidTop)"/>
    <path d="M41 85 L 41 103 L 57 94 Z" fill="#ffffff" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="67" cy="90" r="2.8" fill="#ffffff" opacity="0.55"/>
    <circle cx="27" cy="95" r="2.1" fill="#ffffff" opacity="0.5"/>
    <circle cx="63" cy="102" r="1.7" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- highlights -->
  <path d="M25 70 C 28 60, 36 53, 46 51" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <path d="M60 36 C 66 29, 75 26, 84 27" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- output drop under the spout -->
  <path d="M112 50 C 108.5 56, 107 59.5, 107 62 A 5 5 0 0 0 117 62 C 117 59.5 115.5 56 112 50 Z" fill="url(#drop)"/>
  <circle cx="110.6" cy="61.2" r="1.3" fill="#ffffff" opacity="0.75"/>
</svg>
