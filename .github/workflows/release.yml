# SPDX-License-Identifier: GPL-3.0-or-later
# Release pipeline: on a v* tag, build every artifact for x86-64 and arm64,
# publish a GitHub release, and refresh the signed APT/RPM repositories and
# install.sh on GitHub Pages. `workflow_dispatch` runs everything except the
# publishing steps (a dry run).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dist:
    name: source tarballs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check versions agree
        run: scripts/check-versions.sh
      - run: scripts/make-dist.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-src
          path: dist/*

  deb:
    name: deb ${{ matrix.image }} ${{ matrix.arch }}
    needs: dist
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:26.04", "debian:trixie"]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist-src, path: dist }
      - run: packaging/debian/build.sh "${{ matrix.image }}"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ strategy.job-index }}
          path: dist/deb

  rpm:
    name: rpm ${{ matrix.image }} ${{ matrix.arch }}
    needs: dist
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:45", "almalinux:10", "opensuse/tumbleweed", "opensuse/leap:16.0"]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist-src, path: dist }
      - run: packaging/rpm/build.sh "${{ matrix.image }}"
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ strategy.job-index }}
          path: dist/rpm

  arch:
    name: Arch PKGBUILD (namcap)
    needs: dist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist-src, path: dist }
      - run: packaging/arch/build.sh

  tarball:
    name: portable tarball ${{ matrix.arch }}
    needs: dist
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist-src, path: dist }
      - run: packaging/tarball/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.arch }}
          path: dist/*-linux.tar.xz*

  appimage:
    name: AppImage ${{ matrix.arch }}
    needs: dist
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist-src, path: dist }
      - run: packaging/appimage/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
          path: dist/*.AppImage*

  flatpak:
    name: Flatpak ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Retort-${{ matrix.arch }}.flatpak
          manifest-path: packaging/flatpak/io.github.oreo1298.Retort.json
          arch: ${{ matrix.arch }}
          cache-key: flatpak-${{ matrix.arch }}-${{ hashFiles('packaging/flatpak/*.json') }}
          upload-artifact: true

  publish:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, rpm, arch, tarball, appimage, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Collect files (plus version-less names for install.sh)
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.tar.xz' -o -name '*.AppImage' \
            -o -name '*.zsync' -o -name '*.flatpak' -o -name '*.sha256' \) -exec cp {} out/ \;
          cd out
          for f in *-x86_64-linux.tar.xz *-aarch64-linux.tar.xz; do
            [ -f "$f" ] || continue
            arch=$(echo "$f" | sed -E 's/.*-(x86_64|aarch64)-linux\.tar\.xz/\1/')
            cp "$f" "retort-linux-$arch.tar.xz"
          done
          sha256sum * > SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 ~ "^## \\[?"v"\\]?" {p=1; next} /^## / {p=0} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $v" > notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "Retort ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag

  pages:
    name: APT/RPM repositories + install.sh (GitHub Pages)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, rpm]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, pattern: "{deb,rpm}-*" }
      - name: Merge package directories
        run: |
          mkdir -p pkgs/deb pkgs/rpm
          for d in artifacts/deb-*; do cp -r "$d"/. pkgs/deb/; done
          for d in artifacts/rpm-*; do cp -r "$d"/. pkgs/rpm/; done
          ls -R pkgs | head -50
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils createrepo-c rpm gnupg
      - name: Import signing key
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          if [ -z "$REPO_SIGNING_KEY" ]; then
            echo "::error::Set the REPO_SIGNING_KEY secret (see docs/MAINTAINER.md)"; exit 1
          fi
          echo "$REPO_SIGNING_KEY" | gpg --batch --import
          echo "SIGNING_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_ENV"
      - name: Build repositories
        run: |
          base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          packaging/repo/build-apt-repo.sh "$PWD/pkgs/deb" "$PWD/site"
          packaging/repo/build-rpm-repo.sh "$PWD/pkgs/rpm" "$PWD/site" "$base"
          cp scripts/install.sh site/install.sh
          packaging/repo/index.sh site "$base" > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4
