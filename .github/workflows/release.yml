# SPDX-License-Identifier: GPL-3.0-or-later
# Release pipeline: on a v* tag, test the clone-and-build install of every
# supported distribution (x86-64 and arm64), build the Flatpak, AppImage and
# portable tarball, run every documented command, and publish a GitHub release.
# Native .deb/.rpm/pacman packages are built on the user's machine
# (build-package.sh, PKGBUILD), so they are not release assets.
# `workflow_dispatch` runs everything except publishing (a dry run).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dist:
    name: source tarballs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check versions agree
        run: scripts/check-versions.sh
      - run: scripts/make-dist.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-src
          path: dist/*

  native:
    name: install ${{ matrix.job }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        job: ["debian@ubuntu:24.04", "debian@ubuntu:26.04", "debian@debian:trixie", "fedora@fedora:45",
              "el@almalinux:10", "opensuse@opensuse/tumbleweed", "opensuse@opensuse/leap:16.0"]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
          # Arch Linux has no official arm64 image.
          - { job: "arch@archlinux", arch: x86_64, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install, update and remove exactly as docs/INSTALL.md says
        run: scripts/test-docs.sh "${{ matrix.job }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doc-test-native-${{ strategy.job-index }}
          path: dist/doc-test

  tarball:
    name: portable tarball ${{ matrix.arch }}
    needs: dist
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist-src, path: dist }
      - run: packaging/tarball/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.arch }}
          path: dist/*-linux.tar.xz*

  appimage:
    name: AppImage ${{ matrix.arch }}
    needs: dist
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist-src, path: dist }
      - run: packaging/appimage/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
          path: dist/*.AppImage*

  flatpak:
    name: Flatpak ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Retort-${{ matrix.arch }}.flatpak
          manifest-path: packaging/flatpak/io.github.oreo1298.Retort.json
          arch: ${{ matrix.arch }}
          cache-key: flatpak-${{ matrix.arch }}-${{ hashFiles('packaging/flatpak/*.json') }}
          upload-artifact: true

  docs:
    name: documentation test (other sections and guides)
    needs: [tarball, appimage]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Arrange artifacts as dist/
        run: |
          mkdir -p dist
          find artifacts -name '*-linux.tar.xz' -exec cp {} dist/ \;
          find artifacts -name '*.AppImage' -exec cp {} dist/ \;
      - name: Run the remaining documented commands
        # The native install sections run in the `native` jobs; the Flatpak
        # bundle is built and run in the Flatpak job.
        run: scripts/test-docs.sh appimage tarball source cli dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doc-test-logs
          path: dist/doc-test

  publish:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, tarball, appimage, flatpak, docs]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Collect files (plus the version-less names INSTALL.md downloads)
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.tar.xz' -o -name '*.AppImage' \
            -o -name '*.zsync' -o -name '*.flatpak' -o -name '*.sha256' \) -exec cp {} out/ \;
          cd out
          for f in *-x86_64-linux.tar.xz *-aarch64-linux.tar.xz; do
            [ -f "$f" ] || continue
            arch=$(echo "$f" | sed -E 's/.*-(x86_64|aarch64)-linux\.tar\.xz/\1/')
            cp "$f" "retort-linux-$arch.tar.xz"
          done
          for f in Retort-*-x86_64.AppImage Retort-*-aarch64.AppImage; do
            [ -f "$f" ] || continue
            arch=$(echo "$f" | sed -E 's/.*-(x86_64|aarch64)\.AppImage/\1/')
            cp "$f" "Retort-$arch.AppImage"
          done
          sha256sum * > SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 ~ "^## \\[?"v"\\]?" {p=1; next} /^## / {p=0} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $v" > notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "Retort ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
