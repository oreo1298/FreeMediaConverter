# SPDX-License-Identifier: GPL-3.0-or-later
# Packaging smoke tests (a subset of the release matrix) whenever packaging,
# build or data files change, weekly, and on demand. The native jobs follow
# docs/INSTALL.md as a normal user in a container of their distro: build the
# package from the checkout, install, update, remove.
name: Packaging

on:
  push:
    paths:
      - "packaging/**"
      - "PKGBUILD"
      - "build-package.sh"
      - "docs/install/**"
      - "scripts/doc_test.py"
      - "scripts/make-dist.sh"
      - "meson.build"
      - "meson_options.txt"
      - "data/**"
      - "Cargo.lock"
      - "build-aux/**"
      - ".github/workflows/packaging.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/check-versions.sh
      - run: scripts/make-dist.sh
      - uses: actions/upload-artifact@v4
        with: { name: dist-src, path: dist/* }

  native:
    name: install ${{ matrix.job }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { job: "debian@ubuntu:24.04", arch: x86_64, runner: ubuntu-24.04 }
          - { job: "debian@debian:trixie", arch: aarch64, runner: ubuntu-24.04-arm }
          - { job: "fedora@fedora:45", arch: x86_64, runner: ubuntu-24.04 }
          - { job: "opensuse@opensuse/tumbleweed", arch: x86_64, runner: ubuntu-24.04 }
          - { job: "arch@archlinux", arch: x86_64, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-docs.sh "${{ matrix.job }}"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: doc-test-${{ strategy.job-index }}
          path: dist/doc-test

  tarball:
    name: portable tarball
    needs: dist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist-src, path: dist }
      - run: packaging/tarball/build.sh

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Retort-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.oreo1298.Retort.json
          cache-key: flatpak-x86_64-${{ hashFiles('packaging/flatpak/*.json') }}
      - name: Lint manifest and repo
        run: |
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest packaging/flatpak/io.github.oreo1298.Retort.json || true
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo || true

  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build .#retort -L
      - run: ./result/bin/retort-cli presets > presets.txt && head -3 presets.txt
