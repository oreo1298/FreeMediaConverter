# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p retort --features update-check -- -D warnings
      - run: scripts/check-no-shell.sh
      - name: Docs are generated and every command is covered by the doc test
        run: |
          python3 scripts/gen-install.py --check
          python3 scripts/doc_test.py --list > /dev/null

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning $(git ls-files '*.sh')
      # makepkg provides srcdir/pkgdir/startdir and reads pkgname/arch/... itself.
      - run: shellcheck -S warning -s bash -e SC2034,SC2154 PKGBUILD

  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev ffmpeg
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - name: Build
        run: cargo build --workspace --locked
      - name: Unit and snapshot tests
        run: cargo test --workspace --locked
      - name: Integration tests (system FFmpeg ${{ matrix.arch }})
        run: |
          ffmpeg -hide_banner -version | head -1
          cargo test -p retort-core --test integration --locked -- --include-ignored --test-threads 2

  meson:
    name: meson build, data validation, screenshots
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev meson ninja-build \
            gettext appstream desktop-file-utils ffmpeg xvfb xauth dbus fonts-cantarell
      - uses: Swatinem/rust-cache@v2
        with:
          key: meson
          workspaces: ". -> _build/cargo-target"
      - name: Configure, build, validate, install
        run: |
          meson setup _build --prefix="$PWD/_install" --buildtype=release
          meson compile -C _build
          meson test -C _build --print-errorlogs
          meson install -C _build
          meson compile -C _build retort-pot
      - name: GUI end-to-end conversion (Xvfb)
        run: scripts/e2e-gui.sh _build/retort
      - name: Headless screenshots
        run: scripts/screenshots.sh "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots/*.png

  latest-gnome:
    name: newest GTK/libadwaita (Arch, adw_1_8 features)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed rust libadwaita gtk4 pkgconf gcc git
      - uses: actions/checkout@v4
      - run: cargo clippy -p retort --features adw_1_8 --locked -- -D warnings

  integration-latest-ffmpeg:
    name: integration (FFmpeg 9.0.x)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Cache FFmpeg build
        id: ffcache
        uses: actions/cache@v4
        with:
          path: ffbuild-out
          key: ffmpeg-${{ hashFiles('packaging/ffmpeg/**') }}-x86_64
      - name: Build container image (runtime libraries for the cached build too)
        run: docker build -t retort-ffbuild packaging/ffmpeg
      - name: Build FFmpeg (Debian 13 container)
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ffbuild-out
          docker run --rm -v "$PWD/ffbuild-out:/out" retort-ffbuild build-ffmpeg.sh /out/ffmpeg
      - name: Build integration tests
        id: bin
        run: |
          cargo test -p retort-core --test integration --no-run --locked --message-format=json \
            | jq -r 'select(.reason=="compiler-artifact" and .target.name=="integration" and .executable != null) | .executable' > bin.txt
          echo "path=$(cat bin.txt)" >> "$GITHUB_OUTPUT"
      - name: Run against FFmpeg 9.0.x
        run: |
          docker run --rm -v "$PWD/ffbuild-out:/out" -v "${{ steps.bin.outputs.path }}:/it:ro" -v "$PWD:/src:ro" -w /src \
            -e PATH=/out/ffmpeg/bin:/usr/bin:/bin -e LD_LIBRARY_PATH=/out/ffmpeg/lib \
            retort-ffbuild bash -c 'ffmpeg -version | head -1 && /it --include-ignored --test-threads 2'
