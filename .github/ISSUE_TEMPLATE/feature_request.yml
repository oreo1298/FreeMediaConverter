name: Feature request
description: Suggest a preset, a format, an option or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Retort help?
